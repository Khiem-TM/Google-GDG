services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wellness
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: wellness
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness -d wellness"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.9
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment:
      WELLNESS_DATABASE_URL: postgresql+psycopg://wellness:wellness@postgres:5432/wellness
      WELLNESS_JWT_SECRET: local-compose-secret-must-be-32-chars
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ..
    environment:
      WELLNESS_DATABASE_URL: postgresql+psycopg://wellness:wellness@postgres:5432/wellness
      WELLNESS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WELLNESS_JWT_SECRET: local-compose-secret-must-be-32-chars
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  worker:
    build: ..
    command: ["python", "-m", "app.worker.outbox"]
    environment:
      WELLNESS_DATABASE_URL: postgresql+psycopg://wellness:wellness@postgres:5432/wellness
      WELLNESS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WELLNESS_JWT_SECRET: local-compose-secret-must-be-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
